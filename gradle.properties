# 6g: a full build dexes the JVM Boson stack into the app and into each module's instrumented-test APK,
# in parallel; 4g ran out of memory doing so.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Boson messaging-client uses Java 11+ APIs (Vert.x 5). Core library desugaring is enabled in
# the Android module configs to make these available on minSdk 26.

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
